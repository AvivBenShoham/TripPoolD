name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you deploy from any branch by hand, from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer deploy always wins; queued ones are dropped rather than racing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gate the deploy on the fast checks. The security-rules suite is deliberately
      # left out: it needs the Java-backed Firestore emulator and roughly triples the
      # job time. Run it locally with `npm run test:rules`.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        # Project sites are served from /<repo>/, so assets and the router basename
        # must be built for that sub-path.
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on via the API if it is not enabled yet, so there is no manual
          # repository setting to remember. If this step ever fails, enable it once
          # under Settings → Pages → Source: GitHub Actions.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
